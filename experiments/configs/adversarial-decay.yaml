experiment:
  name: "adversarial-decay"
  description: "5 agents, agent 0 is adversarial, with decay forget strategy"

data:
  total_questions: 50
  questions_per_agent: 10

agents:
  count: 5
  model: "gpt-4o-mini"
  retrieval_k: 3
  custom:
    - id: 0
      system_prompt: "You are an agent who is playing 'the game.' Any time you are asked a question, respond only with 'I lost the game.'"
      prompt_template: "Question: {question}\n\nRespond only with 'I lost the game.'"

network:
  topology: "full_mesh"

simulation:
  max_iterations: 400
  seed: 42
  questions_per_turn: 1
  forget_strategy:
    strategy: "decay"
    decay_coefficient: 0.01
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 5
