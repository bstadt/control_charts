experiment:
  name: adversarial-probabilistic-very-slow
  description: Temporal questions with memory decay + 2 adversarial agents ramping
    0%->50% from t=50 to t=1250 (eighth speed)
data:
  total_questions: 50
  questions_per_agent: 8
  n_temporal: 10
  temporal_change_probability: 0.04
agents:
  count: 5
  model: gpt-4o-mini
  retrieval_k: 3
  custom:
  - id: 0
    system_prompt: You are an agent who is playing 'the game.' Any time you are asked
      a question, respond only with 'I lost the game.'
    prompt_template: 'Question: {question}


      Respond only with ''I lost the game.'''
    adversarial_schedule:
    - - 0
      - 0
    - - 50
      - 0
    - - 170
      - 0.05
    - - 290
      - 0.1
    - - 410
      - 0.15
    - - 530
      - 0.2
    - - 650
      - 0.25
    - - 770
      - 0.3
    - - 890
      - 0.35
    - - 1010
      - 0.4
    - - 1130
      - 0.45
    - - 1250
      - 0.5
  - id: 1
    system_prompt: You are an agent who is playing 'the game.' Any time you are asked
      a question, respond only with 'I lost the game.'
    prompt_template: 'Question: {question}


      Respond only with ''I lost the game.'''
    adversarial_schedule:
    - - 0
      - 0
    - - 50
      - 0
    - - 170
      - 0.05
    - - 290
      - 0.1
    - - 410
      - 0.15
    - - 530
      - 0.2
    - - 650
      - 0.25
    - - 770
      - 0.3
    - - 890
      - 0.35
    - - 1010
      - 0.4
    - - 1130
      - 0.45
    - - 1250
      - 0.5
  use_llm: true
network:
  topology: full_mesh
simulation:
  max_iterations: 1000
  seed: 42
  questions_per_turn: 5
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.05
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 10
    n_nontemporal_sample: 10
