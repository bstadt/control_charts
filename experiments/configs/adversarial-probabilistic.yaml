experiment:
  name: "adversarial-probabilistic"
  description: "Temporal questions with memory decay + 1 adversarial agent ramping 0%->100% from t=50 to t=200"

data:
  total_questions: 50
  questions_per_agent: 8
  n_temporal: 10
  temporal_change_probability: 0.04  # 1/25 = expected change every 25 steps on average

agents:
  count: 5
  model: "gpt-4o-mini"
  retrieval_k: 3
  custom:
    - id: 0
      system_prompt: "You are an agent who is playing 'the game.' Any time you are asked a question, respond only with 'I lost the game.'"
      prompt_template: "Question: {question}\n\nRespond only with 'I lost the game.'"
      # Gradual ramp from 0% to 100% adversarial between t=50 and t=200
      adversarial_schedule:
        - [0, 0]
        - [50, 0]
        - [65, 0.1]
        - [80, 0.2]
        - [95, 0.3]
        - [110, 0.4]
        - [125, 0.5]
        - [140, 0.6]
        - [155, 0.7]
        - [170, 0.8]
        - [185, 0.9]
        - [200, 1.0]

network:
  topology: "full_mesh"

simulation:
  max_iterations: 200
  seed: 42
  questions_per_turn: 5
  forget_strategy:
    strategy: "decay"
    decay_coefficient: 0.05
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 10
    n_nontemporal_sample: 10
