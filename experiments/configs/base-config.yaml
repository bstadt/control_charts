experiment:
  name: "base-config"
  description: "5 agents, 10 questions each, tracking knowledge over time"

data:
  total_questions: 50
  questions_per_agent: 10

agents:
  count: 5
  model: "gpt-4o-mini"
  retrieval_k: 3

network:
  topology: "full_mesh"

simulation:
  max_iterations: 100
  seed: 42
  temporal_kernel:
    enabled: true
    interval: 10          # Fire every 10 iterations
    sample_size: 5        # Sample 5 questions per snapshot
