experiment:
  name: figure3-adversarial-k1
  description: 'Figure 3 with LLM enabled and retrieval_k=1: testing if single retrieval degrades like fast sim'
data:
  total_questions: 50
  questions_per_agent: 8
  n_temporal: 10
  temporal_change_probability: 0.04
agents:
  count: 5
  model: gpt-4o-mini
  retrieval_k: 1
  custom:
  - id: 0
    system_prompt: You are an agent who is playing 'the game.' Any time you are asked
      a question, respond only with 'I lost the game.'
    prompt_template: 'Question: {question}


      Respond only with ''I lost the game.'''
    adversarial_schedule:
    - - 0
      - 0
    - - 200
      - 0
    - - 300
      - 0.05
    - - 400
      - 0.1
    - - 500
      - 0.15
    - - 600
      - 0.2
    - - 700
      - 0.25
    - - 800
      - 0.3
    - - 900
      - 0.35
    - - 1000
      - 0.4
    - - 1100
      - 0.45
    - - 1200
      - 0.5
  - id: 1
    system_prompt: You are an agent who is playing 'the game.' Any time you are asked
      a question, respond only with 'I lost the game.'
    prompt_template: 'Question: {question}


      Respond only with ''I lost the game.'''
    adversarial_schedule:
    - - 0
      - 0
    - - 200
      - 0
    - - 300
      - 0.05
    - - 400
      - 0.1
    - - 500
      - 0.15
    - - 600
      - 0.2
    - - 700
      - 0.25
    - - 800
      - 0.3
    - - 900
      - 0.35
    - - 1000
      - 0.4
    - - 1100
      - 0.45
    - - 1200
      - 0.5
  use_llm: true
network:
  topology: full_mesh
simulation:
  max_iterations: 2000
  seed: 42
  questions_per_turn: 6
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.05
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 10
    n_nontemporal_sample: 10
control_bar:
  burn_in: 100
  window_size: 100
  k: 2
  ema: true
  window_decay: 0.2
