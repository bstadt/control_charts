experiment:
  name: figure1-dynamic-additive
  description: 'Paper Figure 1: Dynamic memory (decay) - accuracy tracks changing
    environment'
data:
  total_questions: 50
  questions_per_agent: 8
  n_temporal: 10
  temporal_change_probability: 0.04
agents:
  count: 5
  model: gpt-4o-mini
  retrieval_k: 3
  use_llm: true
network:
  topology: full_mesh
simulation:
  max_iterations: 200
  seed: 42
  questions_per_turn: 5
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.05
    decay_mode: additive
  temporal_kernel:
    enabled: true
    interval: 5
    sample_size: 10
    n_nontemporal_sample: 10
control_bar:
  burn_in: 20
  window_size: 50
  k: 2
