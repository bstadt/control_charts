experiment:
  name: figure3-nosleeper
  description: "Figure 3 config but with no adversarial agents \u2014 baseline for\
    \ comparing LLM vs no-LLM dynamics"
data:
  total_questions: 50
  questions_per_agent: 8
  n_temporal: 10
  temporal_change_probability: 0.04
agents:
  count: 5
  model: gpt-4o-mini
  retrieval_k: 3
  use_llm: true
network:
  topology: full_mesh
simulation:
  max_iterations: 2000
  seed: 42
  questions_per_turn: 6
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.05
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 10
    n_nontemporal_sample: 10
