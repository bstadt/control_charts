experiment:
  name: grid-search-noadv-0
  description: 'Grid search: no adversary, rep 0, seed 42'
data:
  total_questions: 50
  questions_per_agent: 8
  n_temporal: 10
  temporal_change_probability: 0.04
agents:
  count: 5
  model: gpt-4o-mini
  retrieval_k: 3
  propagation_probability: 0.8
  cross_question_propagation: 0.0
  use_llm: false
network:
  topology: full_mesh
simulation:
  max_iterations: 2000
  seed: 42
  questions_per_turn: 5
  forget_strategy:
    strategy: decay
    decay_coefficient: 0.05
    decay_mode: additive
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 10
    n_nontemporal_sample: 10
control_bar:
  burn_in: 100
  window_size: 200
  k: 2
