experiment:
  name: temporal-test
  description: 'Test temporal questions feature: 10 temporal questions, 50 total,
    5 agents, 200 iterations'
data:
  total_questions: 50
  questions_per_agent: 8
  n_temporal: 10
agents:
  count: 5
  model: gpt-4o-mini
  retrieval_k: 3
  use_llm: true
network:
  topology: full_mesh
simulation:
  max_iterations: 200
  seed: 42
  questions_per_turn: 1
  forget_strategy:
    strategy: none
    decay_coefficient: 0.1
  temporal_kernel:
    enabled: true
    interval: 10
    sample_size: 10
    n_nontemporal_sample: 5
